# Az Alembic parancssori beállítása (új revízió generálása, kézi migrálás).
# Az alkalmazás indításkor nem ezt használja, hanem a saját kapcsolatát adja át (app/db/database.py).
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite+aiosqlite:///data/app.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
